# ffmpegArchive / pythonArchive pins cover the REPACKED payload produced by
# tools/repack-native-media.py (closure-verified removal of dead desktop
# content: static .a archives, gobject introspection data, non-linked tool
# libraries and CPython test modules). Compressed source records are copied
# unchanged, independent of the host Python/zlib version. ELF32/64 load
# segments and retained Python/OpenSSL modules define the dependency closure.
# Exact DT_NEEDED filenames and physical symlink targets are resolved; every
# retained ELF and alias is rechecked in the resulting payload before writing.
# Unused unversioned liblzma.so development aliases are removed so Android can
# resolve its own libunwind dependency; private .so.5 libraries remain intact.
# Both original upstream and resulting archive hashes are enforced by the
# build. The app additionally verifies the resulting FFmpeg archive hash.
# Derive updates only from the pinned Maven 0.18.1 AARs, never arbitrary files.
