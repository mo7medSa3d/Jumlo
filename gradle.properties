org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Release versioning: override per release, e.g. ./gradlew -PversionCode=10843 -PversionName="1.5" :app:assembleRelease
versionCode=10842
versionName=1.4-media-candidate

# KSP1 repeatedly collides on Hilt shadow Java outputs, including nonincremental
# rebuilds. Use the KSP2 engine in the pinned matching Kotlin/KSP distribution.
ksp.useKSP2=true
