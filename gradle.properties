# Gradle 8.14 compiles the build scripts with an embedded Kotlin 1.9 whose Java
# version parser rejects JDK 22+. On such a JDK the build aborts while compiling
# settings.gradle.kts with the bare message "25.0.4.1". Build with JDK 17 or 21:
#   export JAVA_HOME=/usr/lib/jvm/java-17-temurin-jdk
# scripts/check-build-env.sh checks this before the build starts.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
kotlin.code.style=official
# Release versioning: override per release, e.g. ./gradlew -PversionCode=10843 -PversionName="2.0.0" :app:assembleRelease
versionCode=10843
versionName=2.0.0-2026

# KSP1 repeatedly collides on Hilt shadow Java outputs, including nonincremental
# rebuilds. Use the KSP2 engine in the pinned matching Kotlin/KSP distribution.
ksp.useKSP2=true
