name: Android UI and persistence smoke (API 26, 35 and 36)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jumlo-device-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    name: Emulator smoke API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35, 36]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Ensure Android build SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          if [[ ! -f "$sdk/platforms/android-36/android.jar" || ! -x "$sdk/build-tools/36.0.0/aapt2" ]]; then
            sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          fi
      # Compiling full-media APKs while the virtual Android OS is booting
      # starves system_server and can kill the package service before tests
      # start. Compile/debug+instrumentation first, then launch the emulator.
      - name: Compile real Android test APKs before boot
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" -PextendedMedia=true \
            :app:assembleDebug :app:assembleDebugAndroidTest \
            --no-parallel --max-workers=1 --no-daemon --console=plain

      - name: Validate emulator script shell and real test selection
        shell: bash
        run: python3 scripts/test-emulator-smoke-runner.py
      # Hosted Linux runners expose /dev/kvm but do not grant the runner user
      # access by default. Without KVM, API 35/36 are too slow to boot and may
      # crash, making valid instrumentation tests report false negatives.
      - name: Enable hardware acceleration for emulator
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::GitHub runner lacks /dev/kvm; cannot execute real device tests"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm
      # sdkmanager sometimes receives a truncated emulator ZIP on hosted runners.
      # Preinstall and validate it with bounded retries before the runner action,
      # which otherwise attempts just one download and aborts before tests run.
      - name: Install emulator package with retries
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          for attempt in 1 2 3; do
            if sdkmanager --install emulator --channel=0 &&
               "$sdk/emulator/emulator" -version >/dev/null 2>&1; then
              echo "Android emulator package verified"
              break
            fi
            if (( attempt == 3 )); then
              echo "::error::Android emulator SDK package failed after three attempts"
              exit 1
            fi
            echo "::warning::Retrying invalid/truncated emulator SDK package ($attempt/3)"
            sleep $((attempt * 15))
          done
      - name: Execute real Android UI and persistence tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          disable-animations: true
          script: bash scripts/run-emulator-smoke.sh
      - name: Keep reports and logcat even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Jumlo-Android-Smoke-API-${{ matrix.api }}-${{ github.run_id }}
          path: |
            android-smoke.log
            device-logcat.txt
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
