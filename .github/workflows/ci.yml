name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Gradle wrapper
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Restore Gradle wrapper JAR (official, checksum-verified)
        run: |
          bash scripts/restore-wrapper.sh --download

      - name: Debug build
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --console=plain

      - name: Release build
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/
