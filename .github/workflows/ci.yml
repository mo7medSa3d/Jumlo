name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Gradle wrapper
        run: |
          chmod +x gradlew
          ./gradlew --version --no-daemon --console=plain

      - name: Debug build
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --console=plain

      - name: Release build (when signing config available)
        if: env.RELEASE_STORE_PASSWORD != ''
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ ! -f keystore.properties ]; then
            echo "keystore.properties not found; skipping release build"
            exit 0
          fi
          ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/
