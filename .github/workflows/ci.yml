name: Android CI & APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      device_tests:
        description: Run Android emulator tests (API 26 and 36)
        type: boolean
        default: false
        required: false

permissions:
  contents: read

# Cancel obsolete commits instead of paying for their builds.
concurrency:
  group: android-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, lint, R8 and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Restores Gradle 8.14 wrapper, dependencies, plugins and local build cache.
      # Do NOT also use setup-java's Gradle cache or actions/cache on ~/.gradle.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # SDK 36 and Build Tools 36 ship on ubuntu-24.04 runners; only install if absent.
      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk" ]]; then
            echo 'Android SDK environment not found' >&2
            exit 1
          fi
          if [[ ! -f "$sdk/platforms/android-36/android.jar" || ! -x "$sdk/build-tools/36.0.0/aapt2" ]]; then
            sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          fi

      - name: Debug APK, unit tests, lint and release R8
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease \
            -PextendedMedia=false --no-daemon --console=plain 2>&1 | tee gradle.log
          test -s app/build/outputs/apk/debug/app-debug.apk
          (cd app/build/outputs/apk/debug && sha256sum app-debug.apk > app-debug.apk.sha256)

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Jumlo-Debug-APK-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Jumlo-Failure-Logs-${{ github.run_number }}
          path: |
            gradle.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  instrumented:
    # Full device matrix is expensive. Run from Actions > Run workflow when needed.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.device_tests }}
    needs: build
    name: Device tests (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew :app:connectedDebugAndroidTest -PextendedMedia=false --no-daemon --console=plain
