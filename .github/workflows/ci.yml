name: Android CI & APK

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'verification/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'verification/**'
  workflow_dispatch:
    inputs:
      device_tests:
        description: Run Android emulator tests (API 26 and 36)
        type: boolean
        default: false
        required: false
      full_release_check:
        description: Also run release build and R8 shrinker (slow)
        type: boolean
        default: true
        required: false
      extended_media:
        description: Build the opt-in experimental extended-media APK (yt-dlp/FFmpeg, may exceed 60 MB)
        type: boolean
        default: false
        required: false

permissions:
  contents: read

# Cancel obsolete commits instead of paying for their builds.
concurrency:
  group: android-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK, unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Restores Gradle 8.14 wrapper, dependencies, plugins and local build cache.
      # Do NOT also use setup-java's Gradle cache or actions/cache on ~/.gradle.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # SDK 36 and Build Tools 36 ship on ubuntu-24.04 runners; only install if absent.
      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk" ]]; then
            echo 'Android SDK environment not found' >&2
            exit 1
          fi
          if [[ ! -f "$sdk/platforms/android-36/android.jar" || ! -x "$sdk/build-tools/36.0.0/aapt2" ]]; then
            sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          fi

      - name: Debug APK, unit tests and lint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug \
            --no-daemon --console=plain 2>&1 | tee gradle.log
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          bytes=$(stat -c '%s' "$apk")
          echo "APK size: $bytes bytes (hard limit: 60000000)"
          echo "### APK: $bytes / 60000000 bytes" >> "$GITHUB_STEP_SUMMARY"
          if (( bytes > 60000000 )); then
            echo "::error::APK exceeds the hard 60 MB limit: $bytes bytes"
            exit 1
          fi
          if unzip -Z1 "$apk" | grep -E '^lib/.*/lib(ffmpeg|python|qjs)\.so$|^res/raw/ytdlp(\.|$)'; then
            echo "::error::Forbidden heavy media runtime found in APK"
            exit 1
          fi
          (cd app/build/outputs/apk/debug && sha256sum app-debug.apk > app-debug.apk.sha256)

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Jumlo-Debug-APK-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # R8 recompiles all release sources and can add 8+ minutes on code changes.
      # Keep automatic fast feedback on pushes; still verify release on v* tags
      # and on explicit full_release_check workflow dispatches.
      - name: Release R8 (tag or manual full check)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_release_check) }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --console=plain 2>&1 | tee -a gradle.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Jumlo-Failure-Logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            gradle.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  extended_media:
    # Experimental, opt-in only. Bundles the yt-dlp/FFmpeg/Python/QuickJS runtime
    # (GPL-3.0 obligations, native ABIs and live providers are NOT qualified here),
    # so it stays a separate artifact and never changes the standard APK gate.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended_media }}
    name: Extended-media debug APK (experimental)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk" ]]; then
            echo 'Android SDK environment not found' >&2
            exit 1
          fi
          if [[ ! -f "$sdk/platforms/android-36/android.jar" || ! -x "$sdk/build-tools/36.0.0/aapt2" ]]; then
            sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          fi

      - name: Extended-media debug APK, unit tests and lint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew -PextendedMedia=true :app:assembleDebug :app:testDebugUnitTest :app:lintDebug \
            --no-daemon --console=plain 2>&1 | tee gradle-extended.log
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          bytes=$(stat -c '%s' "$apk")
          echo "Extended APK size: $bytes bytes (the 60 MB standard limit does not apply here)"
          echo "### Extended-media APK: $bytes bytes (experimental)" >> "$GITHUB_STEP_SUMMARY"
          (cd app/build/outputs/apk/debug && sha256sum app-debug.apk > app-debug.apk.sha256)

      - name: Upload experimental extended-media APK
        uses: actions/upload-artifact@v7
        with:
          name: Jumlo-Extended-Media-Debug-APK-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Jumlo-Extended-Media-Failure-Logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            gradle-extended.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  instrumented:
    # Full device matrix is expensive. Run from Actions > Run workflow when needed.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.device_tests }}
    needs: build
    name: Device tests (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain
